<form>

  <div [hidden]="ajout">
    <label>ID Famille</label>

    <input
      type="text"
      class="form-control w-25"
      name="idFam"
      [(ngModel)]="famille.idFam"
      readonly>
  </div>

  <div>
    <label>Nom Famille</label>

    <input
      type="text"
      class="form-control"
      name="nomFam"
      [(ngModel)]="famille.nomFam"
      placeholder="Entrez un nom de famille olfactive">
  </div>

  <div class="mt-2">
    <button
      type="button"
      class="btn btn-success"
      [disabled]="!famille.nomFam"
      (click)="saveFamille()">

      {{ ajout ? 'Ajouter' : 'Modifier' }}

    </button>
  </div>

</form>
